# tabdeck configuration.
# Copy to ~/.config/tabdeck/config.toml to customize; that file replaces this one entirely.

# "auto" picks "lua" when ~/.config/hypr/hyprland.lua exists, otherwise "classic".
hyprland = "auto"

[display]
# Resolution of the virtual monitor. "auto" reads it from the tablet over adb.
resolution = "auto"
# Any Hyprland monitor position: "auto-right", "auto-left", or "2646x0".
position = "auto-right"
scale = 1
# Copy the wallpaper from your first monitor (needs awww or swww).
wallpaper = true
# refresh = 60
# name = "TAB"           # Hyprland output name for the virtual monitor

[ports]
# Ports on the tablet's localhost. Change them if another tablet app uses these.
command_center = 8765
display = 5900

[edit]
# Long-press a key on the tablet to edit it. Labels, icons, shortcuts and workspaces
# are always editable. Changing a command from the tablet lets anything that can reach
# the tablet's localhost run commands on this PC, so it is off unless you turn it on.
commands = false

[integrations]
# Show the mull icon and page (https://github.com/silky-x0/mull). If mull isn't installed,
# the page explains how to install it.
mull = true

[hardware]
# Each one is "auto" or a fixed value, like net = "wlan0", battery = "BAT1",
# cpu_sensor = "coretemp", gpu = "nvidia" | "amd" | "none".
net = "auto"
battery = "auto"
cpu_sensor = "auto"
gpu = "auto"

# Keys are shown 6 per row, in order. A key is one of:
#   a workspace switch:  workspace = 1
#   a command:           label, icon, command
#   a shortcut sent to the focused window (needs wtype):  label, icon, shortcut = "ctrl+shift+t"
# Icons are file names from static/icons (Lucide). Add any Lucide SVG there to use it.
# A command is a string (run with sh -c) or a list (run directly, no shell).

[[keys]]
workspace = 1
[[keys]]
workspace = 2
[[keys]]
workspace = 3
[[keys]]
workspace = 4
[[keys]]
workspace = 5
[[keys]]
workspace = 6

[[keys]]
label = "Terminal"
icon = "terminal"
command = "kitty"

[[keys]]
label = "Firefox"
icon = "globe"
command = "firefox"

[[keys]]
label = "Files"
icon = "folder"
command = "xdg-open ~"

[[keys]]
label = "Apps"
icon = "layout-grid"
# Tapping again closes the launcher. Uses HyDE's themed launcher when available.
command = "pkill -x rofi || { command -v hyde-shell >/dev/null && exec hyde-shell rofilaunch d; } || exec rofi -show drun"

[[keys]]
label = "Capture"
icon = "scan"
command = ["hyprshot", "-m", "region"]

[[keys]]
label = "Lock"
icon = "lock"
command = ["loginctl", "lock-session"]

# Per-app pages. When a window with this class is focused, its keys replace the
# default command keys; workspace keys stay. Find a class with: hyprctl activewindow

[[apps.kitty.keys]]
label = "New tab"
icon = "plus"
shortcut = "ctrl+shift+t"
[[apps.kitty.keys]]
label = "Close tab"
icon = "x"
shortcut = "ctrl+shift+q"
[[apps.kitty.keys]]
label = "Prev tab"
icon = "chevron-left"
shortcut = "ctrl+shift+Left"
[[apps.kitty.keys]]
label = "Next tab"
icon = "chevron-right"
shortcut = "ctrl+shift+Right"
[[apps.kitty.keys]]
label = "Copy"
icon = "copy"
shortcut = "ctrl+shift+c"
[[apps.kitty.keys]]
label = "Paste"
icon = "clipboard-paste"
shortcut = "ctrl+shift+v"

[[apps.firefox.keys]]
label = "Back"
icon = "arrow-left"
shortcut = "alt+Left"
[[apps.firefox.keys]]
label = "Forward"
icon = "arrow-right"
shortcut = "alt+Right"
[[apps.firefox.keys]]
label = "Reload"
icon = "rotate-cw"
shortcut = "F5"
[[apps.firefox.keys]]
label = "New tab"
icon = "plus"
shortcut = "ctrl+t"
[[apps.firefox.keys]]
label = "Close tab"
icon = "x"
shortcut = "ctrl+w"
[[apps.firefox.keys]]
label = "Reopen"
icon = "undo-2"
shortcut = "ctrl+shift+t"
